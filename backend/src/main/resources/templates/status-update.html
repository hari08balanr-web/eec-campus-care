<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .header { background-color: #800000; color: white; padding: 10px 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 20px; }
        .ticket-code { font-weight: bold; }
        .status-box { padding: 15px; background-color: #f5f5f5; border-left: 4px solid #800000; margin: 20px 0; }
        .status-value { font-weight: bold; font-size: 18px; color: #800000; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #777; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #800000; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EEC Care</h1>
        </div>
        <div class="content">
            <p>Dear <span th:text="${name}">Student</span>,</p>
            <p>There has been an update regarding your complaint (Ticket Code: <span class="ticket-code" th:text="${ticketCode}">EEC-2023-0001</span>).</p>
            
            <div class="status-box">
                <p>New Status: <span class="status-value" th:text="${newStatus}">In Progress</span></p>
                <p><strong>Admin Remarks:</strong> <span th:text="${adminRemarks}">Will be resolved shortly.</span></p>
            </div>
            
            <div style="text-align: center; margin: 30px 0;">
                <a th:href="@{${'https://eec-care.vercel.app/track/' + ticketCode}}" class="btn">View Details</a>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2024 Eswari Engineering College. All rights reserved.</p>
            <p>This is an automated message, please do not reply.</p>
        </div>
    </div>
</body>
</html>
