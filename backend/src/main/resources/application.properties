server.port=${PORT:8080}

# Auto mode: DataSourceConfig automatically detects whether Supabase Cloud is reachable,
# and gracefully falls back to local H2 if on restricted networks like College Wi-Fi.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:auto}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:warnerthepro@gmail.com}
spring.mail.password=${MAIL_PASSWORD:not_configured}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true

