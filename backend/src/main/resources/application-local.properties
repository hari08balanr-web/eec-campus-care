server.port=8080

# Local H2 Embedded Database (Runs on College Wi-Fi, 100% offline, persistent on disk)
spring.datasource.url=jdbc:h2:file:./data/eeccaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Disable external mail requirements locally
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=warnerthepro@gmail.com
spring.mail.password=not_configured
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local storage fallback
supabase.url=http://localhost:8080
supabase.service.key=local-dummy-key
